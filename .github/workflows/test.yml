name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify synthetic data generation
        run: |
          python generate_synthetic_data.py
          python -c "from tracker.store import ExperimentStore; s = ExperimentStore('experiments.db'); print(f'Experiments: {len(s.list_experiments())}'); print(f'Runs: {len(s.list_runs())}'); s.close()"
