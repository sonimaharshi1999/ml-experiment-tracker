[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ml-experiment-tracker"
version = "1.0.0"
description = "A lightweight experiment tracking system for ML workflows"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maharshi Soni"}]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
    "click>=8.0,<9.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9.0"]

[project.scripts]
ml-tracker = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["tracker*", "dashboard*"]
